        "title": "تفصيل المكونات الخمسة لنظام الاتصال (Data Communication System):",
        "content": "• Message: البيانات والمعلومات المراد نقلها (نصوص، أرقام، صور، صوت، فيديو).\n• Sender: الجهاز المرسل للبيانات (حاسوب، هاتف، كاميرا مراقبة).\n• Receiver: الجهاز المتلقي للمعلومة (طابعة، حاسوب، شاشة).\n• Medium: القناة الفيزيائية (سلكية كـ Twisted Pair والألياف الضوئية، أو لا سلكية كالراديو والمايكروويف).\n• Protocol: مجموعة القواعد والمعايير التي تحكم وتنسق الاتصال (بدون بروتوكول تصبح الأجهزة كشخصين يتحدثان لغتين مختلفتين)."

        "title": "أنماط تدفق البيانات الثلاثة (Data Flow Directions):",

      },

        "title": "مقارنة الطوبولوجيات وحسابات شبكة Mesh (من واقع الشيت):",

      },

        "title": "أقسام وأنماط تعلم الآلة الثلاثة (Taxonomy of ML):",
        "content": "1. Supervised Learning (التعلم الخاضع للإشراف): ندخل للنموذج بيانات تحتوي على المدخلات والنتائج المطلوبة مسبقاً (Features + Labels). ينقسم إلى:\n   - Regression (انحدار): عندما تكون القيمة المتوقعة رقماً مستمراً (مثل توقع أسعار المنازل أو درجات الحرارة).\n   - Classification (تصنيف): عندما تكون القيمة المتوقعة فئة محددة (مثل كشف البريد المزعج Spam vs Not Spam).\n2. Unsupervised Learning (غير الخاضع للإشراف): ندخل بيانات بدون تسميات أو نتائج (Features only)، ويكتشف النموذج البنية الذاتية لها (مثل خوارزمية K-Means لتجزئة السوق).\n3. Reinforcement Learning (التعلم التعزيزي): يتعلم الوكيل الذكي (Agent) اتخاذ القرارات في بيئة تفاعلية بتجربة الخطأ وتعظيم المكافآت (مثل تعليم الروبوتات المشي أو لعب الشطرنج)."

        "content": "• Overfitting (الإفراط في الملاءمة / حفظ التدريب):\n  - الأعراض: دقة 99% في التدريب ودقة 60% في الاختبار.\n  - السبب: تعقيد النموذج الزائد وحفظه للضوضاء (High Variance).\n  - الحلول البرمجية والأكاديمية:\n    1. استخدام تقنيات التنظيم (Regularization): مثل L1 Lasso (يحذف المعاملات غير المهمة) أو L2 Ridge (يقلص أوزان المتغيرات).\n    2. استخدام التحقق المتقاطع (K-Fold Cross-Validation) لضبط المعاملات الفائقة.\n    3. جمع المزيد من بيانات التدريب أو تطبيق تقنيات Data Augmentation.\n    4. تقليل عدد الخصائص وتطبيق خفض الأبعاد (Dimensionality Reduction via PCA)."

      },
      {
        "title": "مقاييس تقييم النماذج من مصفوفة الالتباس (Confusion Matrix):",
        "content": "• Accuracy (الدقة الإجمالية): (TP + TN) / Total. تكون مضللة إذا كانت البيانات غير متوازنة (Imbalanced Data).\n• Precision (الإحكام): TP / (TP + FP)؛ تقيس نسبة الحالات التي توقعها النموذج إيجابية وكانت فعلاً إيجابية (مهمة في كشف البريد المزعج).\n• Recall (الاسترجاع/الحساسية): TP / (TP + FN)؛ تقيس قدرة النموذج على التقاط كل الحالات الإيجابية الفعلية (حرجة جداً في تشخيص السرطان لتجنب الحالات السلبية الخاطئة).\n• F1-Score: المتوسط التوافقي بين Precision و Recall = 2 × (P × R) / (P + R)."

    function PlatformCore() {

      // Sound Synthesizer (Pure Web Audio API - Zero External Files)
      const playSound = (type) => {
        if (!soundEnabled) return;
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);

          if (type === 'correct') {
            osc.frequency.setValueAtTime(587.33, ctx.currentTime);
            osc.frequency.setValueAtTime(880, ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
            osc.start();
            osc.stop(ctx.currentTime + 0.25);
          } else if (type === 'levelUp') {
            osc.frequency.setValueAtTime(523.25, ctx.currentTime);
            osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.09);
            osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.18);
            osc.frequency.setValueAtTime(1046.50, ctx.currentTime + 0.27);
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);

            osc.stop(ctx.currentTime + 0.45);

            osc.frequency.setValueAtTime(340, ctx.currentTime);

               c.code.toLowerCase().includes(q) ||

        const q = query.toLowerCase();

        if (q.includes('سيمبلكس') || q.includes('simplex')) {
          return `خوارزمية السيمبلكس (Simplex Algorithm):
1. الصورة القياسية (Standard Form): تحويل المتباينات (≤) إلى معادلات بإضافة متغيرات راكدة (Slack: S1, S2).
2. جدول البداية (Initial Tableau): وضع المعاملات في الجدول، والحل المبدئي هو (X1=0, X2=0) مع بقاء متغيرات الـ Slack كأساس.
3. عمود المحور (Pivot Column): اختيار المتغير صاحب القيمة الأكثر سلبية في صف Z (دالة الهدف) لتعظيم الربح.
4. صف المحور (Pivot Row): قسمة عمود الثوابت (RHS) على عناصر عمود المحور الموجبة، واختيار أصغر نسبة موجبة لتحديد المتغير الخارج.

        setAiMessages(prev => [...prev, userMsg]);
        setAiInput('');
        setIsAiThinking(true);

        setTimeout(() => {
          const replyText = generateAiReply(textToSend, activeCourse);
          const botMsg = {
            id: Date.now() + 1,
            sender: 'bot',
            text: replyText,
            time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
          };
          setAiMessages(prev => [...prev, botMsg]);
          setIsAiThinking(false);
          playSound('correct');
        }, 350);
      };

      // Quiz Submit
      const handleQuizSubmit = () => {
        if (!activeCourse) return;
        const total = activeCourse.quizQuestions.length;
        let score = 0;
        activeCourse.quizQuestions.forEach((q, idx) => {
          if (quizAnswers[idx] === q.correctIndex) {
            score++;
          }
        });
        setQuizScore(score);
        setQuizSubmitted(true);
        const percent = Math.round((score / total) * 100);
        addXp(score * 15, 'كويز تفاعلي');

        unlockAchievement('firstQuiz');
        if (percent === 100) {
          unlockAchievement('perfectScore');
          playSound('levelUp');
          if (typeof confetti === 'function') confetti({ particleCount: 90, spread: 75 });
        } else {
          playSound('correct');
        }
      };

      return (
        <div dir="rtl" className={`min-h-screen font-sans pb-20 selection:bg-emerald-600 selection:text-white transition-colors duration-200 ${
          theme === 'dark' ? 'dark bg-[#0B1120] text-slate-100' : 'bg-slate-50 text-slate-900'
        }`}>
          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-emerald-600 text-white px-5 py-2.5 rounded-2xl shadow-xl flex items-center gap-2 backdrop-blur-md border border-emerald-400/30 text-xs sm:text-sm font-semibold animate-bounce">
              <span className="w-2 h-2 rounded-full bg-white"></span>
              <span>{toastMessage}</span>

          {/* Top Universal Navigation Bar */}

              <div className="flex items-center justify-between gap-3">
                {/* Logo & Brand */}
                <div 
                  onClick={() => setCurrentView('home')}
                  className="flex items-center gap-3 cursor-pointer group shrink-0"
                >
                  <div className="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white font-bold shadow-md shadow-emerald-600/20 text-base group-hover:scale-105 transition-transform">
                    ZD
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="font-extrabold text-lg sm:text-xl tracking-tight text-slate-900 dark:text-white">زُبدة</span>
                      <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-700 dark:text-emerald-400 border border-emerald-500/20">
                        مقررات DELTA
                      </span>
                    </div>
                    <p className="hidden sm:block text-[11px] text-slate-500 dark:text-slate-400 font-medium">كلية الذكاء الاصطناعي • Level 2</p>
                  </div>
                </div>

                {/* Controls & Theme Switcher */}
                <div className="flex items-center gap-2 text-xs font-semibold flex-wrap justify-end">
                  {/* Theme Toggle (Dark / Light) */}
                  <button
                    onClick={toggleTheme}
                    className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 transition-all shadow-sm"
                    title={theme === 'dark' ? 'التحويل إلى الوضع النهاري' : 'التحويل إلى الوضع الليلي'}
                  >
                    <span>{theme === 'dark' ? '☀️' : '🌙'}</span>
                    <span className="hidden sm:inline text-[11px]">{theme === 'dark' ? 'نهاري' : 'ليلي'}</span>
                  </button>

                  {/* Pomodoro Timer Button */}
                  <button
                    onClick={() => setShowTimerModal(true)}
                    className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 text-amber-700 dark:text-amber-400 transition-all shadow-sm"
                    title="مؤقت المذاكرة بومودورو"
                  >
                    <span>⏱</span>
                    <span className="font-mono text-xs font-bold">{formatTime(timerSeconds)}</span>
                  </button>

                  {/* Sound Toggle */}
                  <button
                    onClick={() => {
                      setSoundEnabled(!soundEnabled);
                      triggerToast(soundEnabled ? 'تم كتم الصوت' : 'تم تفعيل الصوت');
                    }}
                    className="p-1.5 sm:px-2.5 sm:py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 transition-colors"
                    title="تشغيل/كتم الصوت"
                  >
                    <span>{soundEnabled ? '🔊' : '🔇'}</span>
                  </button>

                  {/* Achievements Badge */}
                  <button
                    onClick={() => setShowAchievements(true)}
                    className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-800 dark:text-amber-300 transition-all shadow-sm"
                  >
                    <span>🏅</span>
                    <span className="hidden md:inline text-[11px]">الأوسمة</span>
                  </button>

                  {/* XP & Streak Indicator */}
                  <div className="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-800 dark:text-emerald-400">
                    <span className="font-bold text-xs">{totalXp} XP</span>
                    <span className="text-slate-400">|</span>
                    <span className="text-[11px]">مستوى {level}</span>
                  </div>

                  {/* Visitor Badge */}
                  <button
                    onClick={() => setShowNameModal(true)}
                    className="flex items-center gap-1 px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 transition-colors"
                  >
                    <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span className="max-w-[80px] sm:max-w-[110px] truncate text-[11px] font-medium">

                    </span>
                  </button>
                </div>
              </div>
            </div>

            {/* Browser Tabs Row */}
            <div className="bg-slate-100/90 dark:bg-[#0B1120]/80 border-t border-slate-200 dark:border-slate-800/80 px-4 sm:px-6 lg:px-8 py-2 overflow-x-auto flex items-center gap-1.5 no-scrollbar">

                    <span>{course.code}</span>
                    <span className="hidden sm:inline font-normal text-[11px] text-slate-500 dark:text-slate-400">

                    </span>
                    <button
                      onClick={(e) => handleCloseTab(e, tabId)}
                      className="p-0.5 rounded-md hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors"
                      title="إغلاق التبويب"
                    >
                      ✕
                    </button>
                  </div>
                );
              })}
            </div>
          </header>

          {/* MAIN CONTENT CONTAINER */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">
            {currentView === 'home' ? (
              /* ================== HOME VIEW ================== */
              <div className="space-y-8 animate-fadeIn">
                {/* Modern Hero / Academic Hub Banner */}
                <div className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-emerald-600 via-teal-600 to-slate-900 text-white p-6 sm:p-10 shadow-xl border border-emerald-500/20">
                  <div className="relative z-10 max-w-3xl space-y-4">
                    <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/10 backdrop-blur-md border border-white/20 text-xs font-semibold">
                      <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                      <span>الفصل الدراسي الحالي • المستوى الثاني AI</span>
                    </div>

                    <h1 className="text-2xl sm:text-4xl font-extrabold tracking-tight leading-snug">
                      أهلاً بك {visitorName ? `يا ${visitorName}` : ''} في منصة زُبدة الأكاديمية
                    </h1>

                    <p className="text-sm sm:text-base text-slate-100 leading-relaxed font-normal">
                      مرجعك الجامعي الشامل لمقررات كلية الذكاء الاصطناعي بجامعة الدلتا. شروحات مبسطة ومركزة، بنك أسئلة امتحانية مع التفسير، بطاقات استذكار ذكية، ومختبرات تفاعلية.
                    </p>

                    {/* Quick Stats Badges */}
                    <div className="pt-2 flex flex-wrap gap-2.5 sm:gap-4 text-xs font-semibold">
                      <div className="px-3.5 py-2 rounded-xl bg-slate-900/60 backdrop-blur-md border border-white/10 flex items-center gap-2">
                        <span className="text-emerald-400 font-bold">5</span>
                        <span className="text-slate-200">مقررات تخصصية</span>
                      </div>
                      <div className="px-3.5 py-2 rounded-xl bg-slate-900/60 backdrop-blur-md border border-white/10 flex items-center gap-2">
                        <span className="text-teal-300 font-bold">25</span>
                        <span className="text-slate-200">كورساً عالمياً مجانياً</span>
                      </div>
                      <div className="px-3.5 py-2 rounded-xl bg-slate-900/60 backdrop-blur-md border border-white/10 flex items-center gap-2">
                        <span className="text-amber-300 font-bold">40</span>
                        <span className="text-slate-200">سؤال كويز مع التعليل</span>
                      </div>
                      <div className="px-3.5 py-2 rounded-xl bg-slate-900/60 backdrop-blur-md border border-white/10 flex items-center gap-2">
                        <span className="text-blue-300 font-bold">{avgReadiness}%</span>
                        <span className="text-slate-200">معدل الجاهزية</span>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Search & Filter Bar */}
                <div className="flex flex-col sm:flex-row items-center justify-between gap-4">
                  <div className="relative w-full sm:w-96">
                    <input
                      type="text"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      placeholder="ابحث عن مقرر، كود، أو موضوع..."
                      className="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-800 dark:text-slate-200 placeholder-slate-400 text-xs sm:text-sm focus:outline-none focus:border-emerald-500 shadow-sm transition-colors"
                    />
                    {searchQuery && (
                      <button
                        onClick={() => setSearchQuery('')}
                        className="absolute left-3 top-2.5 text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
                      >
                        مسح
                      </button>
                    )}
                  </div>

                  <div className="flex items-center gap-2 text-xs font-semibold self-end sm:self-auto">
                    <span className="text-slate-500 dark:text-slate-400">المقررات المعروضة:</span>
                    <span className="px-2.5 py-1 rounded-lg bg-emerald-500/10 text-emerald-700 dark:text-emerald-400 font-bold border border-emerald-500/20">
                      {filteredCourses.length} مواد
                    </span>
                  </div>
                </div>

                {/* Course Grid */}
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                  {filteredCourses.map((c) => (
                    <div
                      key={c.id}
                      className="group flex flex-col justify-between rounded-2xl bg-white dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800/80 p-5 hover:border-emerald-500/50 hover:shadow-lg dark:hover:shadow-emerald-950/20 transition-all duration-200"
                    >
                      <div className="space-y-4">
                        {/* Course Header */}
                        <div className="flex items-start justify-between gap-3">
                          <div className="flex items-center gap-3">
                            <span className="text-2xl p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                              {c.icon}
                            </span>
                            <div>
                              <span className="text-[10px] font-mono font-bold uppercase tracking-wider text-emerald-700 dark:text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-md">
                                {c.code}
                              </span>
                              <h3 className="text-base font-bold text-slate-900 dark:text-white mt-1 group-hover:text-emerald-700 dark:group-hover:text-emerald-400 transition-colors">
                                {c.title}
                              </h3>
                            </div>
                          </div>
                        </div>

                        {/* Subtitle / Description */}
                        <p className="text-xs text-slate-600 dark:text-slate-400 leading-relaxed font-normal">
                          {c.subtitle}
                        </p>

                        {/* Files & Readiness */}
                        <div className="space-y-2 pt-2 border-t border-slate-100 dark:border-slate-800/80 text-xs">
                          <div className="flex items-center justify-between text-[11px] text-slate-500 dark:text-slate-400 font-medium">
                            <span>ملفات المقرر المرفقة:</span>
                            <span className="text-slate-700 dark:text-slate-300 font-mono">{c.files.length} ملفات PPTX</span>
                          </div>

                          <div className="space-y-1">
                            <div className="flex justify-between text-[11px]">
                              <span className="text-slate-500 dark:text-slate-400 font-medium">مستوى الجاهزية والاستيعاب:</span>
                              <span className="font-bold text-emerald-700 dark:text-emerald-400">{c.readiness}%</span>
                            </div>
                            <div className="w-full h-1.5 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">
                              <div
                                className="h-full bg-gradient-to-r from-teal-500 to-emerald-500 rounded-full"
                                style={{ width: `${c.readiness}%` }}
                              ></div>
                            </div>
                          </div>
                        </div>
                      </div>

                      {/* Action Buttons */}
                      <div className="pt-5 mt-4 border-t border-slate-100 dark:border-slate-800/80 flex items-center gap-2">
                        <button
                          onClick={() => handleOpenCourse(c.id, 'summary')}
                          className="flex-1 py-2 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-sm transition-all text-center"
                        >
                          فتح المقرر
                        </button>
                        <button
                          onClick={() => handleOpenCourse(c.id, 'quiz')}
                          className="py-2 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-semibold text-xs transition-colors border border-slate-200 dark:border-slate-700"
                          title="الكويز السريع"
                        >
                          كويز
                        </button>
                        <button
                          onClick={() => handleOpenCourse(c.id, 'courses')}
                          className="py-2 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-semibold text-xs transition-colors border border-slate-200 dark:border-slate-700"
                          title="الكورسات المجانية"
                        >
                          كورسات
                        </button>
                      </div>
                    </div>

                </div>

                {/* Quick Academic Toolkit Bar */}
                <div className="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 sm:p-6 shadow-sm">
                  <div className="flex flex-col md:flex-row items-center justify-between gap-4">
                    <div className="space-y-1 text-center md:text-right">
                      <h4 className="text-sm font-bold text-slate-900 dark:text-white">
                        مختبر بحوث العمليات والبرمجة الخطية التفاعلي (Simplex Sandbox)
                      </h4>
                      <p className="text-xs text-slate-500 dark:text-slate-400">
                        جرب تغيير قيم متغيرات القرار X1 و X2 في الوقت الحقيقي وشاهد حسابات دالة الربح Z وتحقق القيود فورياً.
                      </p>
                    </div>
                    <button
                      onClick={() => handleOpenCourse('or', 'sandbox')}
                      className="px-4 py-2 rounded-xl bg-teal-600 hover:bg-teal-500 text-white text-xs font-bold transition-colors whitespace-nowrap shadow-sm"
                    >
                      تجربة المختبر الآن
                    </button>
                  </div>
                </div>
              </div>
            ) : (
              /* ================== COURSE VIEW ================== */
              activeCourse && (
                <div className="space-y-6 animate-fadeIn">
                  {/* Course Header Banner */}
                  <div className="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 sm:p-8 shadow-sm space-y-4">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                      <div className="flex items-center gap-3.5">
                        <span className="text-3xl p-3 rounded-2xl bg-emerald-500/10 text-emerald-700 dark:text-emerald-400 border border-emerald-500/20">
                          {activeCourse.icon}
                        </span>
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="text-xs font-mono font-bold text-emerald-700 dark:text-emerald-400 bg-emerald-500/10 px-2.5 py-0.5 rounded-lg border border-emerald-500/20">
                              {activeCourse.code}
                            </span>
                            <span className="text-xs font-medium text-slate-500 dark:text-slate-400">
                              {activeCourse.instructor}
                            </span>
                          </div>
                          <h2 className="text-xl sm:text-2xl font-black text-slate-900 dark:text-white mt-1">
                            {activeCourse.title}
                          </h2>
                        </div>
                      </div>

                      <div className="flex items-center gap-2 self-start sm:self-auto">
                        <span className="text-xs font-semibold px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700">
                          {activeCourse.status}
                        </span>
                      </div>
                    </div>

                    <p className="text-xs sm:text-sm text-slate-600 dark:text-slate-400 leading-relaxed font-normal">

                    {/* Files Attached Chips */}
                    <div className="flex flex-wrap items-center gap-2 pt-2 border-t border-slate-100 dark:border-slate-800 text-xs">

                        <span

                          className="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 font-mono text-[11px]"
                        >
                          {file}
                        </span>
                      ))}
                    </div>
                  </div>

                  {/* Sub-tabs Navigation */}
                  <div className="flex items-center gap-1.5 p-1.5 rounded-2xl bg-slate-200/80 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 overflow-x-auto no-scrollbar text-xs font-semibold">
                    <button
                      onClick={() => setCourseSubTab('summary')}
                      className={`px-4 py-2 rounded-xl whitespace-nowrap transition-all ${
                        courseSubTab === 'summary'
                          ? 'bg-white text-emerald-800 dark:bg-slate-800 dark:text-emerald-400 shadow-sm border border-slate-200 dark:border-emerald-500/30'
                          : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200'
                      }`}
                    >
                      الشرح والملخص التفصيلي
                    </button>

                    <button
                      onClick={() => setCourseSubTab('quiz')}
                      className={`px-4 py-2 rounded-xl whitespace-nowrap transition-all ${

                          ? 'bg-white text-emerald-800 dark:bg-slate-800 dark:text-emerald-400 shadow-sm border border-slate-200 dark:border-emerald-500/30'
                          : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200'

                    <button

                          : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200'
                      }`}
                    >

                    <button
                      onClick={() => setCourseSubTab('traps')}
                      className={`px-4 py-2 rounded-xl whitespace-nowrap transition-all ${
                        courseSubTab === 'traps'
                          ? 'bg-white text-emerald-800 dark:bg-slate-800 dark:text-emerald-400 shadow-sm border border-slate-200 dark:border-emerald-500/30'
                          : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200'
                      }`}
                    >
                      فخاخ الامتحانات ({activeCourse.examTraps?.length || 0})
                    </button>

                      <button
                        onClick={() => setCourseSubTab('sandbox')}
                        className={`px-4 py-2 rounded-xl whitespace-nowrap transition-all ${
                          courseSubTab === 'sandbox'
                            ? 'bg-teal-600 text-white shadow-sm'
                            : 'text-teal-700 dark:text-teal-400 hover:bg-teal-500/10'
                        }`}
                      >
                        مختبر السيمبلكس التفاعلي
                      </button>
                    )}
                  </div>

                  {/* Sub-tab: Summary & Micro-Learning */}
                  {courseSubTab === 'summary' && (
                    <div className="space-y-6">

                      <div className="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 shadow-sm space-y-3">
                        <div className="flex items-center gap-2">
                          <span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                          <h3 className="text-base font-bold text-slate-900 dark:text-white">
                            {activeCourse.activeChapter}
                          </h3>
                        </div>
                        <p className="text-xs sm:text-sm text-slate-600 dark:text-slate-400 leading-relaxed font-normal">
                          يركز هذا الجزء على استيعاب المفاهيم الهيكلية والرياضية الأساسية وربطها بالتطبيقات البرمجية والامتحانات العملية.
                        </p>
                      </div>

                      {/* Detailed Learning Modules */}
                      {activeCourse.deepExplanations && (
                        <div className="space-y-4">
                          <h3 className="text-sm font-bold text-slate-800 dark:text-slate-200 flex items-center gap-2">
                            <span>الشرح التفصيلي خطوة بخطوة</span>
                            <span className="text-[11px] font-normal text-slate-500 dark:text-slate-400">

                            </span>
                          </h3>

                          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {activeCourse.deepExplanations.map((item, idx) => (
                              <div
                                key={idx}
                                className="rounded-2xl bg-white dark:bg-slate-900/90 border border-slate-200 dark:border-slate-800 p-5 shadow-sm space-y-3"

                                <div className="flex items-center justify-between">
                                  <h4 className="text-xs sm:text-sm font-bold text-emerald-800 dark:text-emerald-400">
                                    {item.topic}
                                  </h4>
                                  <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400">
                                    وحدة {idx + 1}
                                  </span>
                                </div>
                                <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed whitespace-pre-line font-normal">
                                  {item.content}
                                </p>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {/* Summary Points List */}
                      <div className="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 shadow-sm space-y-4">
                        <h4 className="text-sm font-bold text-slate-900 dark:text-white">
                          النقاط الجوهرية للاستذكار السريع
                        </h4>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          {activeCourse.summaryPoints.map((point, idx) => (
                            <div
                              key={idx}
                              className="p-4 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 space-y-1"
                            >
                              <h5 className="text-xs font-bold text-slate-900 dark:text-slate-100">
                                {point.title}
                              </h5>
                              <p className="text-xs text-slate-600 dark:text-slate-400 leading-relaxed font-normal">
                                {point.desc}
                              </p>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}

                  {/* Sub-tab: Quiz */}
                  {courseSubTab === 'quiz' && (
                    <div className="space-y-6">
                      <div className="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 shadow-sm space-y-2">
                        <div className="flex items-center justify-between">
                          <h3 className="text-base font-bold text-slate-900 dark:text-white">
                            اختبار الاستيعاب والفهم الأكاديمي
                          </h3>
                          <span className="text-xs font-semibold px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-700 dark:text-emerald-400 border border-emerald-500/20">
                            {activeCourse.quizQuestions.length} أسئلة مع التعليل
                          </span>
                        </div>
                        <p className="text-xs text-slate-600 dark:text-slate-400">
                          أجب عن الأسئلة واضغط "اعتماد الإجابات" للحصول على تقييم درجاتك مع التفسير العلمي لكل اختيار.
                        </p>
                      </div>

                      {/* Questions List */}
                      <div className="space-y-5">
                        {activeCourse.quizQuestions.map((q, qIdx) => {
                          const isAnswered = quizAnswers[qIdx] !== undefined;
                          const selected = quizAnswers[qIdx];
                          const isCorrect = selected === q.correctIndex;

                          return (
                            <div
                              key={q.id}
                              className="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 sm:p-6 shadow-sm space-y-4"
                            >
                              <div className="flex items-start justify-between gap-3">
                                <h4 className="text-xs sm:text-sm font-bold text-slate-900 dark:text-slate-100 leading-relaxed">
                                  <span className="text-emerald-700 dark:text-emerald-400 font-mono ml-2">[{qIdx + 1}]</span>
                                  {q.question}
                                </h4>
                                {quizSubmitted && (
                                  <span className={`shrink-0 text-xs font-bold px-2.5 py-1 rounded-lg ${
                                    isCorrect
                                      ? 'bg-emerald-500/10 text-emerald-700 dark:text-emerald-400 border border-emerald-500/30'
                                      : 'bg-rose-500/10 text-rose-700 dark:text-rose-400 border border-rose-500/30'
                                  }`}>
                                    {isCorrect ? 'صحيحة ✓' : 'غير صحيحة ✕'}
                                  </span>
                                )}
                              </div>

                              {/* Options */}
                              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                {q.options.map((opt, optIdx) => {
                                  let btnStyle = 'bg-slate-50 dark:bg-slate-800/80 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700';

                                  if (quizSubmitted) {
                                    if (optIdx === q.correctIndex) {
                                      btnStyle = 'bg-emerald-50 dark:bg-emerald-950/40 border-emerald-500 text-emerald-800 dark:text-emerald-300 font-bold';
                                    } else if (selected === optIdx && !isCorrect) {
                                      btnStyle = 'bg-rose-50 dark:bg-rose-950/40 border-rose-500 text-rose-800 dark:text-rose-300';
                                    } else {
                                      btnStyle = 'opacity-50 bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-500';
                                    }
                                  } else if (selected === optIdx) {
                                    btnStyle = 'bg-emerald-50 dark:bg-emerald-950/40 border-emerald-500 text-emerald-800 dark:text-emerald-300 font-bold shadow-sm';
                                  }

                                  return (
                                    <button
                                      key={optIdx}
                                      disabled={quizSubmitted}
                                      onClick={() => {
                                        setQuizAnswers({ ...quizAnswers, [qIdx]: optIdx });
                                        playSound('correct');
                                      }}
                                      className={`p-3 rounded-xl border text-right text-xs leading-relaxed transition-all flex items-center justify-between ${btnStyle}`}
                                    >
                                      <span>{opt}</span>
                                      <span className="font-mono text-[10px] text-slate-400 ml-2">
                                        {String.fromCharCode(65 + optIdx)}
                                      </span>
                                    </button>
                                  );
                                })}
                              </div>

                              {/* Rationale / Explanation */}
                              {quizSubmitted && q.rationale && (
                                <div className="p-3.5 rounded-xl bg-slate-100 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-xs text-slate-700 dark:text-slate-300 space-y-1">
                                  <span className="font-bold text-emerald-700 dark:text-emerald-400 block">
                                    التعليل الأكاديمي:
                                  </span>
                                  <p className="leading-relaxed font-normal">{q.rationale}</p>
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>

                      {/* Quiz Submit & Score Bar */}
                      <div className="sticky bottom-6 z-30 p-4 rounded-2xl bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border border-slate-200 dark:border-slate-800 shadow-xl flex items-center justify-between gap-4">
                        <div className="text-xs">
                          {quizSubmitted ? (
                            <span className="font-bold text-slate-900 dark:text-white">
                              النتيجة: {quizScore} من {activeCourse.quizQuestions.length} (
                              {Math.round((quizScore / activeCourse.quizQuestions.length) * 100)}%)
                            </span>
                          ) : (
                            <span className="text-slate-500 dark:text-slate-400">
                              تمت الإجابة على {Object.keys(quizAnswers).length} من {activeCourse.quizQuestions.length}
                            </span>
                          )}
                        </div>

                        <div className="flex items-center gap-2">
                          {quizSubmitted ? (
                            <button
                              onClick={() => {
                                setQuizSubmitted(false);
                                setQuizAnswers({});
                                setQuizScore(null);
                              }}
                              className="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold transition-colors"
                            >
                              إعادة المحاولة
                            </button>
                          ) : (
                            <button
                              onClick={handleQuizSubmit}
                              disabled={Object.keys(quizAnswers).length === 0}
                              className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 text-white text-xs font-bold shadow-sm transition-all"
                            >
                              اعتماد الإجابات ورؤية التقييم
                            </button>
                          )}
                        </div>
                      </div>
                    </div>
                  )}

                  {/* Sub-tab: Flashcards */}
                  {courseSubTab === 'flashcards' && activeCourse.flashcards && (
                    <div className="space-y-6">
                      <div className="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 shadow-sm space-y-2">
                        <div className="flex items-center justify-between">
                          <h3 className="text-base font-bold text-slate-900 dark:text-white">
                            بطاقات الاستذكار السريع والتكرار المتباعد
                          </h3>
                          <span className="text-xs font-semibold px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-700 dark:text-emerald-400 border border-emerald-500/20">
                            بطاقة {cardIdx + 1} من {activeCourse.flashcards.length}
                          </span>
                        </div>
                        <p className="text-xs text-slate-600 dark:text-slate-400">
                          اضغط على البطاقة لقلبها واكتشاف التعريف والمفهوم الرياضي المخفي.
                        </p>
                      </div>

                      {/* The Flip Card */}
                      <div className="flex justify-center">
                        <div
                          onClick={() => {
                            setIsFlipped(!isFlipped);
                            playSound('cardFlip');
                            unlockAchievement('cardMaster');
                          }}
                          className="w-full max-w-xl h-64 sm:h-72 rounded-3xl bg-white dark:bg-slate-800 border-2 border-dashed border-emerald-500/40 p-8 flex flex-col justify-between cursor-pointer hover:border-emerald-500 transition-all shadow-md text-center select-none"
                        >
                          <div className="flex items-center justify-between text-xs text-slate-400">
                            <span>{isFlipped ? 'الإجابة والتفسير' : 'السؤال والمصطلح'}</span>
                            <span className="font-mono text-[11px]">{cardIdx + 1} / {activeCourse.flashcards.length}</span>
                          </div>

                          <div className="my-auto space-y-2">
                            <h4 className="text-base sm:text-xl font-bold text-slate-900 dark:text-white leading-relaxed">
                              {isFlipped
                                ? activeCourse.flashcards[cardIdx].back
                                : activeCourse.flashcards[cardIdx].front}
                            </h4>
                          </div>

                          <div className="text-[11px] text-slate-400 font-medium">
                            انقر في أي مكان للقلب
                          </div>
                        </div>
                      </div>

                      {/* Card Controls */}
                      <div className="flex items-center justify-center gap-4">
                        <button
                          disabled={cardIdx === 0}
                          onClick={() => {
                            setCardIdx(cardIdx - 1);
                            setIsFlipped(false);
                          }}
                          className="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 disabled:opacity-30 text-slate-700 dark:text-slate-300 text-xs font-bold transition-colors"
                        >
                          ← البطاقة السابقة
                        </button>

                        <button
                          onClick={() => {
                            setIsFlipped(!isFlipped);
                            playSound('cardFlip');
                          }}
                          className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold transition-colors shadow-sm"
                        >
                          قلب البطاقة
                        </button>

                        <button
                          disabled={cardIdx === activeCourse.flashcards.length - 1}
                          onClick={() => {
                            setCardIdx(cardIdx + 1);
                            setIsFlipped(false);
                          }}
                          className="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 disabled:opacity-30 text-slate-700 dark:text-slate-300 text-xs font-bold transition-colors"
                        >
                          البطاقة التالية →
                        </button>
                      </div>
                    </div>
                  )}

                  {/* Sub-tab: Free Courses */}
                  {courseSubTab === 'courses' && activeCourse.onlineCourses && (
                    <div className="space-y-6">
                      <div className="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 shadow-sm space-y-2">
                        <div className="flex items-center justify-between">
                          <h3 className="text-base font-bold text-slate-900 dark:text-white">
                            أفضل الكورسات المجانية المعتمدة عالمياً
                          </h3>
                          <span className="text-xs font-semibold px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-700 dark:text-emerald-400 border border-emerald-500/20">
                            {activeCourse.onlineCourses.length} كورسات منتقاة
                          </span>
                        </div>
                        <p className="text-xs text-slate-600 dark:text-slate-400">
                          شروحات من كبرى الجامعات والمنصات (Coursera, MIT OCW, YouTube) لتثبيت الفهم العملي والنظري.
                        </p>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {activeCourse.onlineCourses.map((crs, i) => (
                          <div
                            key={i}
                            className="rounded-2xl bg-white dark:bg-slate-900/90 border border-slate-200 dark:border-slate-800 p-5 shadow-sm space-y-4 flex flex-col justify-between"
                          >
                            <div className="space-y-3">
                              <div className="flex items-start justify-between gap-2">
                                <span className="text-[10px] font-bold px-2.5 py-1 rounded-lg bg-teal-500/10 text-teal-700 dark:text-teal-400 border border-teal-500/20">
                                  {crs.platform}
                                </span>
                                <span className="text-[11px] text-slate-500 dark:text-slate-400 font-medium">
                                  {crs.language}
                                </span>
                              </div>

                              <h4 className="text-sm font-bold text-slate-900 dark:text-white leading-snug">
                                {crs.title}
                              </h4>

                              <div className="text-[11px] text-slate-500 dark:text-slate-400 space-y-0.5">
                                <div><strong className="text-slate-700 dark:text-slate-300">المحاضر:</strong> {crs.instructor}</div>
                                <div><strong className="text-slate-700 dark:text-slate-300">المستوى:</strong> {crs.level} • {crs.duration}</div>
                              </div>

                              <p className="text-xs text-slate-600 dark:text-slate-400 leading-relaxed font-normal">
                                {crs.desc}
                              </p>
                            </div>

                            <a
                              href={crs.link}
                              target="_blank"
                              rel="noopener noreferrer"
                              className="w-full py-2.5 px-4 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 font-bold text-xs transition-colors flex items-center justify-center gap-1.5 border border-slate-200 dark:border-slate-700 mt-2"
                            >
                              <span>مشاهدة الكورس مجاناً</span>
                              <span>↗</span>
                            </a>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* Sub-tab: Exam Traps */}
                  {courseSubTab === 'traps' && activeCourse.examTraps && (
                    <div className="space-y-5">
                      <div className="rounded-2xl bg-amber-500/10 border border-amber-500/30 p-6 space-y-2">
                        <h3 className="text-base font-bold text-amber-900 dark:text-amber-300">
                          فخاخ الامتحانات وأشهر الأخطاء الشائعة
                        </h3>
                        <p className="text-xs text-amber-800 dark:text-amber-200/90 leading-relaxed">
                          مجموعة من النقاط الدقيقة التي يقع فيها معظم الطلاب في امتحانات الميدترم والفاينل، احرص على تدوينها ومراجعتها قبل الامتحان.
                        </p>
                      </div>

                      <div className="space-y-3">
                        {activeCourse.examTraps.map((trap, idx) => (
                          <div
                            key={idx}
                            className="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 shadow-sm space-y-2"
                          >
                            <div className="flex items-center gap-2">
                              <span className="w-2 h-2 rounded-full bg-amber-500"></span>
                              <h4 className="text-xs font-bold text-slate-900 dark:text-white">
                                تنبيه امتحاني رقم {idx + 1}
                              </h4>
                            </div>
                            <p className="text-xs sm:text-sm text-slate-700 dark:text-slate-300 leading-relaxed font-normal">
                              {trap}
                            </p>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* Sub-tab: Simplex Sandbox (OR) */}
                  {courseSubTab === 'sandbox' && activeCourse.id === 'or' && (
                    <div className="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 shadow-sm space-y-6">
                      <div className="space-y-2">
                        <h3 className="text-base font-bold text-slate-900 dark:text-white">
                          مختبر البرمجة الخطية التفاعلي (LP Simulator)
                        </h3>
                        <p className="text-xs text-slate-600 dark:text-slate-400">
                          مثال معمل الكراسي والمكاتب: دالة الربح Z = 50(X1) + 40(X2).
                          قيد النجارة: 2(X1) + 4(X2) ≤ 100 ساعة.
                          قيد الدهان: 3(X1) + 2(X2) ≤ 90 ساعة.
                        </p>
                      </div>

                      {/* Sliders */}
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div className="space-y-2">
                          <div className="flex justify-between text-xs">
                            <span className="font-bold text-slate-800 dark:text-slate-200">كمية إنتاج الكراسي (X1):</span>
                            <span className="font-mono font-bold text-emerald-700 dark:text-emerald-400">{lpX1} وحدة</span>
                          </div>
                          <input
                            type="range"
                            min="0"
                            max="50"
                            value={lpX1}
                            onChange={(e) => setLpX1(Number(e.target.value))}
                            className="w-full accent-emerald-500 cursor-pointer"
                          />
                        </div>

                        <div className="space-y-2">
                          <div className="flex justify-between text-xs">
                            <span className="font-bold text-slate-800 dark:text-slate-200">كمية إنتاج المكاتب (X2):</span>
                            <span className="font-mono font-bold text-teal-700 dark:text-teal-400">{lpX2} وحدة</span>
                          </div>
                          <input
                            type="range"
                            min="0"
                            max="50"
                            value={lpX2}
                            onChange={(e) => setLpX2(Number(e.target.value))}
                            className="w-full accent-teal-500 cursor-pointer"
                          />
                        </div>
                      </div>

                      {/* Calculations Output */}
                      {(() => {
                        const totalProfit = 50 * lpX1 + 40 * lpX2;
                        const carpHours = 2 * lpX1 + 4 * lpX2;
                        const paintHours = 3 * lpX1 + 2 * lpX2;
                        const isCarpFeasible = carpHours <= 100;
                        const isPaintFeasible = paintHours <= 90;
                        const isFeasible = isCarpFeasible && isPaintFeasible;

                        return (
                          <div className="p-4 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 space-y-4 text-xs">
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                              <div className="p-3 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                                <span className="text-slate-500 dark:text-slate-400 block mb-1">الربح الإجمالي (Z):</span>
                                <span className="text-lg font-bold font-mono text-emerald-700 dark:text-emerald-400">
                                  ${totalProfit}
                                </span>
                              </div>

                              <div className="p-3 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                                <span className="text-slate-500 dark:text-slate-400 block mb-1">ساعات النجارة (≤ 100):</span>
                                <span className={`font-mono font-bold text-sm ${isCarpFeasible ? 'text-slate-900 dark:text-slate-100' : 'text-rose-600'}`}>
                                  {carpHours} / 100 س {isCarpFeasible ? '✓' : '(تجاوز!)'}
                                </span>
                              </div>

                              <div className="p-3 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                                <span className="text-slate-500 dark:text-slate-400 block mb-1">ساعات الدهان (≤ 90):</span>
                                <span className={`font-mono font-bold text-sm ${isPaintFeasible ? 'text-slate-900 dark:text-slate-100' : 'text-rose-600'}`}>
                                  {paintHours} / 90 س {isPaintFeasible ? '✓' : '(تجاوز!)'}
                                </span>
                              </div>
                            </div>

                            <div className="flex items-center gap-2">
                              <span className="font-bold text-slate-800 dark:text-slate-200">حالة الحل (Feasibility):</span>
                              <span className={`px-2.5 py-1 rounded-md font-bold text-xs ${
                                isFeasible
                                  ? 'bg-emerald-500/10 text-emerald-700 dark:text-emerald-400 border border-emerald-500/20'
                                  : 'bg-rose-500/10 text-rose-700 dark:text-rose-400 border border-rose-500/20'
                              }`}>
                                {isFeasible ? 'حل مقبول ضمن منطقة الحلول الممكنة (Feasible Solution)' : 'حل غير مقبول يتعدى قيود الموارد (Infeasible)'}
                              </span>
                            </div>
                          </div>
                        );
                      })()}
                    </div>
                  )}
                </div>
              )
            )}
          </main>

          {/* POMODORO TIMER MODAL */}
          {showTimerModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
              <div className="relative w-full max-w-sm p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-2xl text-center space-y-5">
                <button
                  onClick={() => setShowTimerModal(false)}
                  className="absolute top-4 left-4 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
                >
                  ✕
                </button>

                <div className="space-y-1">
                  <h3 className="text-base font-bold text-slate-900 dark:text-white">مؤقت بومودورو للتركيز</h3>
                  <p className="text-xs text-slate-500 dark:text-slate-400">جلسة دراسية نقية (25 دقيقة) يعقبها 5 دقائق استراحة</p>
                </div>

                <div className="py-4">
                  <span className="font-mono text-4xl sm:text-5xl font-black text-emerald-700 dark:text-emerald-400 tracking-wider">
                    {formatTime(timerSeconds)}
                  </span>
                </div>

                <div className="flex items-center justify-center gap-2">
                  <button
                    onClick={() => {
                      setIsTimerRunning(!isTimerRunning);
                      playSound('correct');
                    }}
                    className={`flex-1 py-2.5 rounded-xl font-bold text-xs transition-colors shadow-sm ${
                      isTimerRunning
                        ? 'bg-amber-600 hover:bg-amber-500 text-white'
                        : 'bg-emerald-600 hover:bg-emerald-500 text-white'
                    }`}
                  >
                    {isTimerRunning ? 'إيقاف مؤقت' : 'بدء التركيز'}
                  </button>

                  <button
                    onClick={() => {
                      setIsTimerRunning(false);
                      setTimerSeconds(25 * 60);
                    }}
                    className="py-2.5 px-4 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-bold text-xs transition-colors"
                  >
                    إعادة ضبط
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ACHIEVEMENTS MODAL */}
          {showAchievements && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
              <div className="relative w-full max-w-md p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-2xl space-y-5">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-bold text-slate-900 dark:text-white">سجل الأوسمة والإنجازات</h3>
                  <button
                    onClick={() => setShowAchievements(false)}
                    className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
                  >
                    ✕
                  </button>
                </div>

                <div className="grid grid-cols-2 gap-3 text-xs">
                  {[
                    { id: 'firstQuiz', name: 'أول كويز', desc: 'إتمام أول اختبار', icon: '📝' },
                    { id: 'perfectScore', name: 'العلامة الكاملة', desc: 'الحصول على 100% في كويز', icon: '💯' },
                    { id: 'pomodoroMaster', name: 'بطل التركيز', desc: 'إنهاء جلسة بومودورو 25 دقيقة', icon: '⏱' },
                    { id: 'cardMaster', name: 'ملك البطاقات', desc: 'مراجعة البطاقات الذكية', icon: '🗂' },
                    { id: 'honorStudent', name: 'طالب متميز', desc: 'الوصول للمستوى 3 أو أعلى', icon: '🎓' },
                    { id: 'aiInquirer', name: 'المستفسر الذكي', desc: 'استشارة المساعد في 3 أسئلة', icon: '🤖' }
                  ].map((badge) => {
                    const isUnlocked = achievements[badge.id];
                    return (
                      <div
                        key={badge.id}
                        className={`p-3.5 rounded-2xl border flex items-center gap-3 transition-all ${
                          isUnlocked
                            ? 'bg-amber-500/10 border-amber-500/30 text-amber-900 dark:text-amber-200'
                            : 'bg-slate-50 dark:bg-slate-800/40 border-slate-200 dark:border-slate-700/60 text-slate-400 opacity-60'
                        }`}
                      >
                        <span className="text-xl">{badge.icon}</span>
                        <div>
                          <h5 className="font-bold text-xs">{badge.name}</h5>
                          <p className="text-[10px] text-slate-500 dark:text-slate-400">{badge.desc}</p>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* FLOATING AI STUDY ASSISTANT */}
          <div className="fixed bottom-6 left-6 z-40">
            <button
              onClick={() => {
                setIsAiOpen(!isAiOpen);
                unlockAchievement('aiInquirer');
              }}
              className="flex items-center gap-2 px-4 py-3 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold text-xs shadow-xl shadow-emerald-600/30 hover:scale-105 transition-all"
            >
              <span>المساعد الذكي</span>
            </button>
          </div>

          {/* AI CHAT DRAWER */}
          {isAiOpen && (
            <div className="fixed bottom-20 left-4 sm:left-6 z-40 w-[92vw] sm:w-96 h-[500px] rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-2xl flex flex-col overflow-hidden animate-slideUp">
              {/* Drawer Header */}
              <div className="p-3.5 bg-slate-100/90 dark:bg-slate-800/90 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <div className="w-2.5 h-2.5 rounded-full bg-emerald-500"></div>
                  <div>
                    <h4 className="text-xs font-bold text-slate-900 dark:text-white">رفيق المذاكرة الذكي</h4>
                    <span className="text-[10px] text-slate-500 dark:text-slate-400">مقررات Level 2 Delta</span>
                  </div>
                </div>
                <button
                  onClick={() => setIsAiOpen(false)}
                  className="p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
                >
                  ✕
                </button>
              </div>

              {/* Messages Area */}
              <div className="flex-1 overflow-y-auto p-4 space-y-3 text-xs">
                {aiMessages.map(msg => (
                  <div
                    key={msg.id}
                    className={`flex gap-2 ${msg.sender === 'user' ? 'justify-start flex-row-reverse' : 'justify-start'}`}
                  >
                    <div
                      className={`max-w-[85%] rounded-2xl p-3 leading-relaxed whitespace-pre-wrap ${
                        msg.sender === 'user'
                          ? 'bg-emerald-600 text-white font-semibold'
                          : 'bg-slate-100 dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700/60 text-slate-800 dark:text-slate-200'
                      }`}
                    >
                      <p>{msg.text}</p>
                      <span className="block text-[9px] mt-1 text-slate-400 font-mono text-left">{msg.time}</span>
                    </div>
                  </div>
                ))}
                {isAiThinking && (
                  <div className="flex items-center gap-2 text-slate-400 text-xs py-1">
                    <span className="animate-spin">⏳</span>
                    <span>المساعد يفكر في الإجابة الأكاديمية...</span>
                  </div>
                )}
              </div>

              {/* Input Area */}
              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  handleSendAiMessage();
                }}
                className="p-2.5 bg-slate-50 dark:bg-slate-800/90 border-t border-slate-200 dark:border-slate-700/60 flex items-center gap-2"
              >
                <input
                  type="text"
                  value={aiInput}
                  onChange={(e) => setAiInput(e.target.value)}
                  placeholder="اكتب سؤالك وسيجيبك المساعد فوراً..."
                  className="flex-1 py-2 px-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 focus:border-emerald-500 focus:outline-none text-xs text-slate-800 dark:text-white placeholder-slate-400"
                />
                <button
                  type="submit"
                  disabled={!aiInput.trim()}
                  className="p-2 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 text-white font-bold text-xs"
                >
                  إرسال
                </button>
              </form>
            </div>
          )}

          {/* VISITOR WELCOME MODAL */}
          {showNameModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
              <div className="relative w-full max-w-md p-6 sm:p-8 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-2xl space-y-5 text-center">
                <div className="w-12 h-12 mx-auto rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white text-xl font-bold shadow-md">
                  ZD
                </div>
                <div className="space-y-1">
                  <span className="text-[11px] font-semibold px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-700 dark:text-emerald-400 border border-emerald-500/20">
                    كلية الذكاء الاصطناعي • جامعة الدلتا
                  </span>
                  <h2 className="text-xl sm:text-2xl font-black text-slate-900 dark:text-white">مرحباً بك في منصة زُبدة</h2>
                  <p className="text-xs text-slate-500 dark:text-slate-400">
                    رفيق المذاكرة لمقررات المستوى الثاني بكلية الذكاء الاصطناعي
                  </p>
                </div>

                <form onSubmit={handleSaveVisitorName} className="space-y-4 text-right">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-2">
                      اكتب اسمك لنرحب بك ونخصص لك تجربة المذاكرة:
                    </label>
                    <input
                      type="text"
                      autoFocus
                      value={nameInput}
                      onChange={(e) => setNameInput(e.target.value)}
                      placeholder="مثال: أحمد، سارة، محمود..."
                      className="w-full px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 focus:border-emerald-500 focus:outline-none text-xs text-slate-900 dark:text-white placeholder-slate-400"
                    />
                  </div>
                  <div className="flex items-center gap-2 pt-1">
                    <button
                      type="submit"
                      className="flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs transition-colors shadow-sm"
                    >
                      ابدأ المذاكرة
                    </button>
                    <button
                      type="button"
                      onClick={handleSkipName}
                      className="py-2.5 px-4 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 text-xs font-semibold"
                    >
                      دخول كضيف
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* FOOTER (THE ONLY SINGLE PLACE WITH CREATOR ATTRIBUTION) */}
          <footer className="mt-16 py-8 border-t border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-950/60 text-xs text-slate-500 dark:text-slate-400 transition-colors">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2">
                <div className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
                <span className="text-slate-700 dark:text-slate-300 font-bold">منصة زُبدة التعليمية • جامعة الدلتا للعلوم والتكنولوجيا</span>
              </div>
              <div className="flex flex-wrap items-center justify-center gap-2 text-center sm:text-left">
                <span>تصميم وتطوير:</span>
                <span className="font-extrabold text-emerald-700 dark:text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-lg border border-emerald-500/20">
                  م/ محمد شعبان • كلية الذكاء الاصطناعي (Level 2)
                </span>
              </div>
            </div>
          </footer>
        </div>
      );
    }


    ReactDOM.createRoot(document.getElementById('root')).render(<PlatformCore />);
  </script>
</body>
</html>
